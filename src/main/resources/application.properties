# Configuración por defecto: para correr en el PC y en los tests.
# Usa H2, una base en memoria que no necesita instalar nada (los datos se pierden al detener).
spring.application.name=retailflow-backend

# Render asigna el puerto en la variable PORT; en el PC se usa 8080
server.port=${PORT:8080}

# DB_CLOSE_DELAY=-1: sin esto H2 borra la base cuando el pool cierra sus conexiones inactivas
# y la tabla "desaparece" tras un rato sin uso
spring.datasource.url=jdbc:h2:mem:retailflow;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea o actualiza las tablas a partir de las entidades al arrancar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
