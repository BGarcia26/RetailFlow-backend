# Perfil "prod": lo activa Render con SPRING_PROFILES_ACTIVE=prod.
# Los datos de conexión vienen de variables de entorno: nunca se escriben contraseñas en el código.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
